name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: go (vet, lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - name: go test
        run: go test -race ./...
      - name: go build
        run: go build ./...
      - name: dev compose file is valid
        run: docker compose -f dev/docker-compose.yml config -q

  publish-guard:
    name: publish-guard (generic rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan tracked files and PR commits
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            scripts/publish_guard.sh --ci --base "origin/${{ github.base_ref }}" --head "${{ github.event.pull_request.head.sha }}"
          else
            scripts/publish_guard.sh --ci --files-only
          fi

  openspec:
    name: openspec validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install -g @fission-ai/openspec@1.0.2
      - run: scripts/openspec_validate.sh
        env:
          OPENSPEC_TELEMETRY: "0"
