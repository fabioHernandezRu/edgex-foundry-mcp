version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: error-strings
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Test fixtures intentionally contain example credentials to exercise redaction.
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
